name: Build and release

# Every push is built. Pushes to main additionally bump the version,
# commit it back ([skip ci], no loop), and publish a GitHub release
# carrying the signed APK + update.json, which the app's self-updater reads.
on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -x test
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  bump-and-release:
    needs: build
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/dualcam-release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Bump version
        id: bump
        run: |
          python3 - <<'EOF'
          import os, re
          p = 'gradle.properties'
          s = open(p).read()
          m = re.search(r'^versionCode=(\d+)$', s, re.M)
          code = int(m.group(1)) + 1
          s = s[:m.start(1)] + str(code) + s[m.end(1):]
          m2 = re.search(r'^versionName=(.+)$', s, re.M)
          parts = m2.group(1).strip().split('.')
          if len(parts) == 2:
              parts.append('1')
          else:
              parts[-1] = str(int(parts[-1]) + 1)
          name = '.'.join(parts)
          s = s[:m2.start(1)] + name + s[m2.end(1):]
          open(p, 'w').write(s)
          print(f'versionCode={code} versionName={name}')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'versionCode={code}\nversionName={name}\n')
          EOF

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease -x test
        env:
          RELEASE_STORE_FILE: /tmp/dualcam-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare release assets
        run: |
          VN='${{ steps.bump.outputs.versionName }}'
          VC='${{ steps.bump.outputs.versionCode }}'
          cp app/build/outputs/apk/release/app-release.apk "dualcam-v$VN.apk"
          printf '{"versionCode": %s, "versionName": "%s", "apkUrl": "https://github.com/Areo-RGB/dual-camera-sync/releases/download/v%s/dualcam-v%s.apk"}\n' \
            "$VC" "$VN" "$VN" "$VN" > update.json
          cat update.json

      - name: Commit version bump, tag, and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VN='${{ steps.bump.outputs.versionName }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add gradle.properties
          git commit -m "Bump version to v$VN [skip ci]"
          git push origin HEAD:main
          git tag "v$VN"
          git push origin "v$VN"
          NOTES="$(git log -1 --format=%s HEAD~1)"
          if gh release view "v$VN" >/dev/null 2>&1; then
            gh release upload "v$VN" "dualcam-v$VN.apk" update.json --clobber
          else
            gh release create "v$VN" "dualcam-v$VN.apk" update.json \
              --title "v$VN" --notes "Automated build of $NOTES"
          fi
